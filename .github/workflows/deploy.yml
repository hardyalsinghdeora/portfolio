# Tests, then deploys dist/ to the existing Cloudflare Pages project on every push to main.
# Pull requests run the tests only.
# One-time setup (repo > Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  shown on the Workers & Pages overview page
#   REDLINE_PATTERN        the private redline regex (see src/guard.js). The tests need it, and
#                          each deploy copies it to the Pages project as a secret before shipping.
# The worker's other secrets (GEMINI_API_KEY and friends) stay in the Pages project settings.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deploy only runs if this passes: unit + agent tests, the retrieval eval, the redline check
  # and a smoke test of the bundled worker.
  test:
    # Pinned: Playwright 1.56 has no Chromium build for ubuntu-latest's Ubuntu 26.04 image.
    # Move to ubuntu-latest once the Playwright devDependency supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci && npx playwright install --with-deps chromium

      - name: Build and test
        env:
          REDLINE_PATTERN: ${{ secrets.REDLINE_PATTERN }}
        run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Rebuild so what ships is exactly what the test job built, whichever machine committed dist/.
      - name: Build
        run: node scripts/build.mjs && test -f dist/_worker.js && test -f dist/index.html

      # Before the new code goes live, so its output guard never starts without the list (it
      # would fail closed and withhold every public answer).
      - name: Sync the redline secret to Pages
        env:
          REDLINE_PATTERN: ${{ secrets.REDLINE_PATTERN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$REDLINE_PATTERN" || { echo "REDLINE_PATTERN secret is not set"; exit 1; }
          printf '%s' "$REDLINE_PATTERN" | npx --yes wrangler@4 pages secret put REDLINE_PATTERN --project-name=hardyalsinghdeora

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=hardyalsinghdeora --branch=main --commit-dirty=true
