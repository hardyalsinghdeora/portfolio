import { claudeAgent, toJsonSchema, runAgentWithFallback, CLAUDE_VERSION } from "../src/providers.js";
import { feedbackToken, toEvalCandidates, FEEDBACK_TTL, MAX_COMMENT } from "../src/feedback.js";

const out = document.getElementById("out");
const results = [];
async function test(name, fn) {
  try { await fn(); results.push({ name, ok: true }); }
  catch (e) { results.push({ name, ok: false, err: e && (e.stack || e.message || String(e)) }); }
}
function assert(c, msg) { if (!c) throw new Error(msg || "assertion failed"); }
function eq(a, b, msg) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((msg || "not equal") + `: ${JSON.stringify(a)} !== ${JSON.stringify(b)}`); }

const chunks = buildChunks(PROFILE);
const index = buildIndex(chunks);

// Deterministic stand-in for Gemini embeddings: hashed bag of words, 768 dims.
function fakeVector(text) {
  const v = new Array(768).fill(0);
  for (const t of tokenize(text)) { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) >>> 0; v[h % 768] += 1; }
  return v;
}

// Mock of the Gemini REST API. `script` is a list of generateContent replies (parts arrays).
function mockGemini({ script = [], embed = "ok", calls = [] } = {}) {
  let step = 0;
  return async (url, init) => {
    const body = JSON.parse(init.body);
    calls.push({ url, body });
    if (url.includes(":batchEmbedContents")) {
      if (embed === "fail") return new Response("quota", { status: 429 });
      return Response.json({ embeddings: body.requests.map((r) => ({ values: fakeVector(r.content.parts[0].text) })) });
    }
    if (url.includes(":generateContent")) {
      if (script === "429") return new Response("quota", { status: 429 });
      const parts = script[Math.min(step++, script.length - 1)];
      return Response.json({ candidates: [{ content: { role: "model", parts } }],
        usageMetadata: { promptTokenCount: 100, candidatesTokenCount: 20, thoughtsTokenCount: 5, totalTokenCount: 125 } });
    }
    return new Response("unexpected " + url, { status: 500 });
  };
}

// ---- chunking & retrieval ----

// ---- agent loop ----
const env = { GEMINI_API_KEY: "test", RAG_EMBEDDINGS: "off" };

await test("agent: tool call, then a grounded answer with sources", async () => {

await test("usage: tokens, latency and cost per answer, and every passage the model saw", async () => {

  const meta = JSON.parse((await res.text()).split(SEP)[1]);

  const points = [];
  recordUsage({ USAGE_AE: { writeDataPoint: (d) => points.push(d) } }, "ask", meta.usage, "bm25", "linkedin");
  eq(points[0].indexes[0], "ask"); eq(points[0].blobs[3], "linkedin"); eq(points[0].doubles[1], 200);
  recordUsage({ USAGE_AE: { writeDataPoint: (d) => points.push(d) } }, "ask", meta.usage, "bm25", "evil");
  eq(points[1].blobs[3], "", "unknown source not recorded");
  recordUsage({ USAGE_AE: { writeDataPoint: () => { throw new Error("AE down"); } } }, "ask", meta.usage, "bm25");

await test("guard: blocks leaks, and never blocks the profile's own text", () => {

});
await test("guard: /api/ask and /api/fit replace guarded text and never return it", async () => {

// Mock of the Claude Messages API: replies are content-block arrays (or a function of the request).
function mockClaude(script, calls = [], { stop } = {}) {
  let step = 0;
  return async (url, init) => {
    if (!url.startsWith("https://api.anthropic.com/")) return new Response("unexpected " + url, { status: 500 });
    const body = JSON.parse(init.body);
    calls.push({ headers: init.headers, body: JSON.parse(JSON.stringify(body)) });
    const next = script[Math.min(step++, script.length - 1)];
    const content = typeof next === "function" ? next(body) : next;
    return Response.json({ id: "msg_" + step, model: body.model, content, stop_reason: stop || (content.some((b) => b.type === "tool_use") ? "tool_use" : "end_turn"),
      usage: { input_tokens: 1000, output_tokens: 100 } });
  };
}
const claudeEnv = { ...env, ANTHROPIC_API_KEY: "sk-test" };
const thinking = { type: "thinking", thinking: "", signature: "sig-1" };
const toolUse = (id, name, input) => ({ type: "tool_use", id, name, input });

await test("claude: tool schemas convert to closed JSON Schema", () => {
  const t = toJsonSchema({ type: "OBJECT", properties: { section: { type: "STRING", enum: ["a", "b"] }, list: { type: "ARRAY", items: { type: "OBJECT", properties: { x: { type: "INTEGER" } }, required: ["x"] } } }, required: ["section"] });
  eq(t.type, "object"); eq(t.additionalProperties, false); eq(t.properties.section.type, "string"); eq(t.properties.section.enum.join(), "a,b");
  eq(t.properties.list.items.additionalProperties, false); eq(t.properties.list.items.properties.x.type, "integer");
  const empty = toJsonSchema({ type: "OBJECT", properties: {} });
  eq(JSON.stringify(empty), JSON.stringify({ type: "object", properties: {}, required: [], additionalProperties: false }));
});
await test("claude: request shape, tool loop with thinking echoed back, usage and cost", async () => {
  const calls = [];
  const step0 = [thinking, toolUse("toolu_1", "search_profile", { query: "agents" })];
  const fetchImpl = mockClaude([step0, [{ type: "text", text: "Bounded agents." }]], calls);
  const r = await runAgent({ turns, index, profile: PROFILE, env: claudeEnv, fetchImpl, provider: claudeAgent(claudeEnv, fetchImpl) });
  eq(r.text, "Bounded agents."); eq(calls.length, 2); eq(r.steps[0].tool, "search_profile");
  const [c0, c1] = calls;
  eq(c0.headers["anthropic-version"], CLAUDE_VERSION); eq(CLAUDE_VERSION, "2026-10-21"); eq(c0.headers["x-api-key"], "sk-test");
  eq(c0.headers["anthropic-beta"], "server-side-fallback-2026-07-01"); eq(c0.body.fallbacks, "default");
  eq(c0.body.model, "claude-opus-5-5"); eq(c0.body.system, SYSTEM);
  assert(!("temperature" in c0.body) && !("top_p" in c0.body), "no sampling parameters on API version 2026-10-21");
  assert(calls.every((c) => c.body.tool_choice.type !== "any" && c.body.tool_choice.type !== "tool"), "never forced tool use");
  eq(c0.body.tool_choice.type, "auto");
  const sec = c0.body.tools.find((t) => t.name === "get_section");
  eq(sec.strict, true); eq(sec.input_schema.additionalProperties, false); assert(sec.input_schema.properties.section.enum.includes("experience"));
  eq(c1.body.messages.length, 3);
  eq(JSON.stringify(c1.body.messages[1]), JSON.stringify({ role: "assistant", content: step0 }), "assistant turn echoed verbatim, thinking included");
  const tr = c1.body.messages[2].content;
  eq(c1.body.messages[2].role, "user"); eq(tr.length, 1); eq(tr[0].type, "tool_result"); eq(tr[0].tool_use_id, "toolu_1");
  assert(JSON.parse(tr[0].content).passages.length > 0);
  eq(r.usage.model, "claude-opus-5-5"); eq(r.usage.input_tokens, 2000); eq(r.usage.output_tokens, 200);
  eq(r.usage.cost_usd, 0.012, "2,000 x $4/1M + 200 x $20/1M from the built-in price table");
});
await test("claude: nudges once when the first step skips retrieval, and the last step can't call tools", async () => {
  const calls = [];
  const fetchImpl = mockClaude([[{ type: "text", text: "Guessing." }], [toolUse("t1", "search_profile", { query: "x" })], [{ type: "text", text: "Grounded." }]], calls);
  const r = await runAgent({ turns, index, profile: PROFILE, env: claudeEnv, fetchImpl, provider: claudeAgent(claudeEnv, fetchImpl) });
  eq(r.text, "Grounded."); eq(calls.length, 3);
  const m = calls[1].body.messages;

// In-memory KV with the parts of the API the Worker uses, including list() and put options.
function memKV() {
  const data = new Map(), opts = new Map();
  return { data, opts,
    get: async (k, type) => { const v = data.get(k); return v == null ? null : type === "json" ? JSON.parse(v) : v; },
    put: async (k, v, o) => { data.set(k, v); opts.set(k, o); },
    list: async ({ prefix }) => ({ keys: [...data.keys()].filter((k) => k.startsWith(prefix)).sort().map((name) => ({ name })), list_complete: true }),
  };
}

// Mock Gemini for the fit pipeline: the extract call returns `reqs`; the judge call builds its
// verdicts with judge(candidateIdsPerRequirement), read from the real prompt the pipeline sent.
function mockFit(reqs, judge, calls = []) {
  return async (url, init) => {
    const body = JSON.parse(init.body);
    calls.push(body);
    if (url.includes(":batchEmbedContents")) return new Response("off", { status: 500 });
    const text = body.contents[0].parts[0].text;
    const out = text.startsWith("Job description:")
      ? { requirements: reqs }
      : judge([...text.matchAll(/candidates: (.*)$/gm)].map((m) => m[1] === "none" ? [] : m[1].split(", ")));
    return Response.json({ candidates: [{ content: { role: "model", parts: [{ text: JSON.stringify(out) }] } }] });
  };
}

  const ids = bm25(index, e.q).slice(0, 5).map((x) => chunks[x.i].id);
  const ok = (id) => e.expect.some((p) => id === p || (p.endsWith("-") && id.startsWith(p)) || id.startsWith(p + "-") || id === p);
  const h1 = ids.length && ok(ids[0]), h5 = ids.some(ok);
  hit1 += h1 ? 1 : 0; hit5 += h5 ? 1 : 0;
  return `<tr><td>${h5 ? "✓" : "✗"}</td><td>${e.q}</td><td>${ids.join(", ")}</td></tr>`;
});
await test(`retrieval eval: hit@5 ≥ 90% (${hit5}/${evals.length}), hit@1 ${hit1}/${evals.length}`, () => {
  assert(hit5 / evals.length >= 0.9, `hit@5 ${hit5}/${evals.length}`);
});
document.getElementById("evals").innerHTML =
  `<p>hit@1 <b>${hit1}/${evals.length}</b> · hit@5 <b>${hit5}/${evals.length}</b> · ${chunks.length} chunks</p>` +
  `<table><tr><th></th><th>Question</th><th>Top 5 chunk ids</th></tr>${rows.join("")}</table>`;

// ---- report ----
const failed = results.filter((r) => !r.ok);
out.innerHTML = results.map((r) => `<div class="t ${r.ok ? "ok" : "bad"}">${r.name}${r.ok ? "" : `<pre>${String(r.err).replace(/</g, "&lt;")}</pre>`}</div>`).join("");
document.getElementById("summary").textContent = `${results.length - failed.length}/${results.length} passed`;
window.__TESTS__ = { passed: results.length - failed.length, total: results.length, failed: failed.map((f) => f.name + ": " + f.err), hit1, hit5, evals: evals.length };
</script>
</body>
