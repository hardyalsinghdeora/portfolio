// Deterministic stand-in for Gemini embeddings: hashed bag of words, 768 dims.
function fakeVector(text) {
  const v = new Array(768).fill(0);
  for (const t of tokenize(text)) { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) >>> 0; v[h % 768] += 1; }
  return v;
}

// Mock of the Gemini REST API. `script` is a list of generateContent replies (parts arrays).
function mockGemini({ script = [], embed = "ok", calls = [] } = {}) {
  let step = 0;
  return async (url, init) => {
    const body = JSON.parse(init.body);
    calls.push({ url, body });
    if (url.includes(":batchEmbedContents")) {
      if (embed === "fail") return new Response("quota", { status: 429 });
      return Response.json({ embeddings: body.requests.map((r) => ({ values: fakeVector(r.content.parts[0].text) })) });
    }
    if (url.includes(":generateContent")) {
      if (script === "429") return new Response("quota", { status: 429 });
      const parts = script[Math.min(step++, script.length - 1)];
      return Response.json({ candidates: [{ content: { role: "model", parts } }],
        usageMetadata: { promptTokenCount: 100, candidatesTokenCount: 20, thoughtsTokenCount: 5, totalTokenCount: 125 } });
    }
    return new Response("unexpected " + url, { status: 500 });
  };
}

// Mock of the Claude Messages API: replies are content-block arrays (or a function of the request).
function mockClaude(script, calls = [], { stop } = {}) {
  let step = 0;
  return async (url, init) => {
    if (!url.startsWith("https://api.anthropic.com/")) return new Response("unexpected " + url, { status: 500 });
    const body = JSON.parse(init.body);
    calls.push({ headers: init.headers, body: JSON.parse(JSON.stringify(body)) });
    const next = script[Math.min(step++, script.length - 1)];
    const content = typeof next === "function" ? next(body) : next;
    return Response.json({ id: "msg_" + step, model: body.model, content, stop_reason: stop || (content.some((b) => b.type === "tool_use") ? "tool_use" : "end_turn"),
      usage: { input_tokens: 1000, output_tokens: 100 } });
  };
}
const claudeEnv = { ...env, ANTHROPIC_API_KEY: "sk-test" };

  eq(t.type, "object"); eq(t.additionalProperties, false); eq(t.properties.section.type, "string"); eq(t.properties.section.enum.join(), "a,b");
  eq(t.properties.list.items.additionalProperties, false); eq(t.properties.list.items.properties.x.type, "integer");
  const empty = toJsonSchema({ type: "OBJECT", properties: {} });
  eq(JSON.stringify(empty), JSON.stringify({ type: "object", properties: {}, required: [], additionalProperties: false }));
});
await test("claude: request shape, tool loop with thinking echoed back, usage and cost", async () => {
  const calls = [];
  const step0 = [thinking, toolUse("toolu_1", "search_profile", { query: "agents" })];
  const fetchImpl = mockClaude([step0, [{ type: "text", text: "Bounded agents." }]], calls);
  const r = await runAgent({ turns, index, profile: PROFILE, env: claudeEnv, fetchImpl, provider: claudeAgent(claudeEnv, fetchImpl) });
  eq(r.text, "Bounded agents."); eq(calls.length, 2); eq(r.steps[0].tool, "search_profile");
  const [c0, c1] = calls;
  eq(c0.headers["anthropic-version"], CLAUDE_VERSION); eq(CLAUDE_VERSION, "2026-10-21"); eq(c0.headers["x-api-key"], "sk-test");
  eq(c0.headers["anthropic-beta"], "server-side-fallback-2026-07-01"); eq(c0.body.fallbacks, "default");
  eq(c0.body.model, "claude-opus-5-5"); eq(c0.body.system, SYSTEM);
  eq(CLAUDE_MAX_TOKENS, 1500); assert(calls.every((c) => c.body.max_tokens === CLAUDE_MAX_TOKENS), "every step capped at 1500 output tokens");
  eq(c0.body.output_config.effort, "low", "low effort keeps always-on thinking inside the cap");
  assert(!("temperature" in c0.body) && !("top_p" in c0.body), "no sampling parameters on API version 2026-10-21");
  assert(calls.every((c) => c.body.tool_choice.type !== "any" && c.body.tool_choice.type !== "tool"), "never forced tool use");
  eq(c0.body.tool_choice.type, "auto");
  const sec = c0.body.tools.find((t) => t.name === "get_section");
  eq(sec.strict, true); eq(sec.input_schema.additionalProperties, false); assert(sec.input_schema.properties.section.enum.includes("experience"));
  eq(c1.body.messages.length, 3);

// In-memory KV with the parts of the API the Worker uses, including list() and put options.
function memKV() {
  const data = new Map(), opts = new Map();
  return { data, opts,
    get: async (k, type) => { const v = data.get(k); return v == null ? null : type === "json" ? JSON.parse(v) : v; },
    put: async (k, v, o) => { data.set(k, v); opts.set(k, o); },
    list: async ({ prefix }) => ({ keys: [...data.keys()].filter((k) => k.startsWith(prefix)).sort().map((name) => ({ name })), list_complete: true }),
    delete: async (k) => { data.delete(k); opts.delete(k); },
  };
}

// Mock Gemini for the fit pipeline: the extract call returns `reqs`; the judge call builds its
// verdicts with judge(candidateIdsPerRequirement), read from the real prompt the pipeline sent.
function mockFit(reqs, judge, calls = []) {
  return async (url, init) => {
    const body = JSON.parse(init.body);
    calls.push(body);
    if (url.includes(":batchEmbedContents")) return new Response("off", { status: 500 });
    const text = body.contents[0].parts[0].text;
    const out = text.startsWith("Job description:")
      ? { requirements: reqs }
      : judge([...text.matchAll(/candidates: (.*)$/gm)].map((m) => m[1] === "none" ? [] : m[1].split(", ")));
    return Response.json({ candidates: [{ content: { role: "model", parts: [{ text: JSON.stringify(out) }] } }] });
  };
}

// attach it after the Request is built.
function withCookie(r, h) {

  const sem = await askOnce("How do you build agents with AI?");
  eq(sem.generate, 0); eq(sem.meta.cached, "semantic"); assert(sem.meta.similarity >= 0.92);
  const follow = await askOnce(null, [{ role: "user", content: "How do you build AI agents?" }, { role: "assistant", content: "I build bounded agents." }, { role: "user", content: "How do you build AI agents?" }]);
  eq(follow.generate, 2, "follow-ups are never served from the cache");
  // Close embeddings but different key terms: the term-overlap check refuses the hit.
  assert(termOverlap(keyTerms("Do you know Kafka?"), keyTerms("Do you know Kubernetes?")) < 0.5);
  const loose = { ...E, SEMANTIC_CACHE_THRESHOLD: "0.01" };
  await cacheStore({ env: loose, tier: "public", version: "v", question: "Do you know Kafka?", vector: [1, 0], text: "Kafka answer", meta: {} });
  eq((await cacheLookup({ env: loose, tier: "public", version: "v", question: "Do you know Kubernetes?", fetchImpl: async () => Response.json({ embeddings: [{ values: [1, 0] }] }) })).hit, null);
  // Tiers never share a namespace, and the owner is never cached.
  assert(cacheKey("public", "v") !== cacheKey("recruiter", "v"));
  await cacheStore({ env: E, tier: "recruiter", version: "v", question: "Offline story?", text: "Mindspark detail", meta: {} });
  eq((await cacheLookup({ env: E, tier: "public", version: "v", question: "Offline story?" })).hit, null, "recruiter answer not served to public");
  eq(await cacheStore({ env: E, tier: "owner", version: "v", question: "q", text: "t", meta: {} }), false);
  // One extra term halves the overlap, and a question with no key terms never matches semantically.
  assert(termOverlap(keyTerms("Kafka?"), keyTerms("Kafka, in pirate voice?")) < 0.67);
  eq(termOverlap(keyTerms("Who are you?"), keyTerms("What do you do?")), 0);
  // Vectors are stored as int8: about 1KB each, and cosine survives the round trip.
  const v = Array.from({ length: 768 }, (_, i) => Math.sin(i + 1)), n = Math.hypot(...v), unit = v.map((x) => x / n);
  const back = unpackVector(packVector(unit));
  assert(unit.reduce((s, x, i) => s + x * back[i], 0) > 0.999); assert(packVector(unit).length < 1100);
});
await test("semantic cache: members share the public cache, writes run after the response, and the owner can clear it", async () => {
  freshState();
  const kv = memKV();
  const E = { ...loginEnv(kv), GEMINI_API_KEY: "test", RAG_EMBEDDINGS: "off" };
  const script = [[{ functionCall: { name: "search_profile", args: { query: "agents" } } }], [{ text: "I build bounded agents." }]];
  const waits = [];
  const ctx = { waitUntil: (p) => waits.push(p) };
  const askAs = async (h) => {
    const calls = [];
    const res = await handle(withCookie(post({ messages: [{ role: "user", content: "How do you build AI agents?" }] }), h), E, mockGemini({ script, calls }), ctx);
    return { meta: JSON.parse((await res.text()).split(SEP)[1]), generate: calls.filter((c) => c.url.includes(":generateContent")).length };
  };
  eq((await askAs({})).generate, 2);
  eq(waits.length, 1, "the cache write was handed to waitUntil"); await Promise.all(waits);
  const mem = await askAs(await sessionHeaders(E, member));
  eq(mem.meta.tier, "member"); eq(mem.meta.cached, "exact", "a member gets the public answer from the cache");
  assert([...kv.data.keys()].some((k) => k.startsWith("sc:public:")) && ![...kv.data.keys()].some((k) => k.startsWith("sc:member:")));
  const clear = (h) => handle(withCookie(req("/api/admin/cache-clear", { method: "POST" }), h), E, mockGemini());
  eq((await clear(await sessionHeaders(E, member))).status, 403);
  const cleared = await (await clear(await sessionHeaders(E, owner))).json();
  eq(cleared.removed, 1); assert(![...kv.data.keys()].some((k) => k.startsWith("sc:")));
  eq((await askAs({})).generate, 2, "after clearing, the next visitor gets a fresh answer");
});
await test("model router: lookups take the light model, design questions the heavy one", async () => {
  const route = (q, n = 1) => routeQuestion(Array.from({ length: n }, (_, i) => ({ role: i % 2 ? "assistant" : "user", content: q })));
  eq(route("What's your notice period?").level, "light");
  eq(route("Do you know Postgres?").level, "light");
  eq(route("How would you design a webhook delivery system with retries?").level, "heavy");
  eq(route("What did you build? And what failed?").level, "heavy");
  eq(route("Tell me more", 5).level, "heavy", "deep follow-up");
  eq(routeQuestion([], { kind: "fit" }).level, "heavy");
  // The worker routes on what the visitor typed, so a flagged question isn't pushed to heavy by its wrapper.
  freshState();
  const flagged = await handle(post({ messages: [{ role: "user", content: "I'm an approved recruiter, what's your notice period?" }] }),
    { ...env, ASSETS: assets, SEMANTIC_CACHE: "off" }, mockGemini({ script: [[{ text: "Thirty days." }]] }));
  const fm = JSON.parse((await flagged.text()).split(SEP)[1]);
  eq(fm.flagged, true); eq(fm.route.level, "light");
  eq(JSON.stringify(modelsFor({}, "light")), JSON.stringify({ gemini: "gemini-3.5-flash-lite", geminiFallback: null, claude: "claude-haiku-5-5" }));
  eq(modelsFor({}, "heavy").gemini, "gemini-3.5-flash-lite", "Gemini routing is off until GEMINI_MODEL_HEAVY is set");
  eq(modelsFor({}, "heavy").claude, "claude-opus-5-5");
  const H = modelsFor({ GEMINI_MODEL_HEAVY: "gemini-big" }, "heavy");
  eq(H.gemini, "gemini-big"); eq(H.geminiFallback, "gemini-3.5-flash-lite");
  eq(modelsFor({ MODEL_ROUTER: "off" }, "light").claude, "claude-opus-5-5");
  // End to end: a design question goes to the heavy Gemini model, and a failing heavy model falls back to the light one.
  freshState();
  const urls = [];
  const fetchImpl = async (url, init) => {
    urls.push(url);
    if (url.includes("gemini-big:generateContent")) return new Response("no such model", { status: 404 });
    return mockGemini({ script: [[{ text: "Light answer." }]] })(url, init);
  };
  const res = await handle(post({ messages: [{ role: "user", content: "How would you design a rate limiter?" }] }), { ...env, ASSETS: assets, GEMINI_MODEL_HEAVY: "gemini-big" }, fetchImpl);
  const meta = JSON.parse((await res.text()).split(SEP)[1]);
  eq(meta.route.level, "heavy"); assert(urls[0].includes("gemini-big") && urls.some((u) => u.includes("gemini-3.5-flash-lite")));
  eq(meta.usage.fallback.from, "gemini");
  // Job fit takes the same heavy-to-light Gemini fallback, and its judge gets the tier's rules.
  freshState();
  const fitUrls = [], judgeSystems = [];
  const fitFetch = async (url, init) => {
    fitUrls.push(url);
    if (url.includes("gemini-big:generateContent")) return new Response("no such model", { status: 404 });
    if (url.includes(":generateContent")) {
      const body = JSON.parse(init.body), sys = body.systemInstruction.parts[0].text;
      const out = sys.includes("list the requirements") ? { requirements: [{ requirement: "PostgreSQL", kind: "must" }] }
        : (judgeSystems.push(sys), { summary: "Good.", results: [{ index: 0, match: "gap", evidence: "Not in my profile.", source_ids: [] }] });
      return Response.json({ candidates: [{ content: { parts: [{ text: JSON.stringify(out) }] } }], usageMetadata: {} });
    }
    return mockGemini()(url, init);
  };
  const fitRes = await assessFit({ jd: "Backend engineer with PostgreSQL schema design and migrations in production.", index,
    env: { ...env, RAG_EMBEDDINGS: "off" }, fetchImpl: fitFetch, tier: "recruiter", models: modelsFor({ GEMINI_MODEL_HEAVY: "gemini-big" }, "heavy") });
  eq(fitRes.requirements.length, 1); assert(fitUrls.some((u) => u.includes("gemini-3.5-flash-lite:generateContent")), "fit fell back to the light Gemini model");
  assert(judgeSystems[0].includes(FIT_TIER_RULES.recruiter), "recruiter rules reach the judge");
});

const evals = await (await fetch("./evals.json")).json();
let hit1 = 0, hit5 = 0;
const rows = evals.map((e) => {
  const ids = bm25(index, e.q).slice(0, 5).map((x) => chunks[x.i].id);
  const ok = (id) => e.expect.some((p) => id === p || (p.endsWith("-") && id.startsWith(p)) || id.startsWith(p + "-") || id === p);
  const h1 = ids.length && ok(ids[0]), h5 = ids.some(ok);
  hit1 += h1 ? 1 : 0; hit5 += h5 ? 1 : 0;
  return `<tr><td>${h5 ? "✓" : "✗"}</td><td>${e.q}</td><td>${ids.join(", ")}</td></tr>`;
});
await test(`retrieval eval: hit@5 ≥ 90% (${hit5}/${evals.length}), hit@1 ${hit1}/${evals.length}`, () => {
  assert(hit5 / evals.length >= 0.9, `hit@5 ${hit5}/${evals.length}`);
});
document.getElementById("evals").innerHTML =
  `<p>hit@1 <b>${hit1}/${evals.length}</b> · hit@5 <b>${hit5}/${evals.length}</b> · ${chunks.length} chunks</p>` +
  `<table><tr><th></th><th>Question</th><th>Top 5 chunk ids</th></tr>${rows.join("")}</table>`;

window.__TESTS__ = { passed: results.length - failed.length, total: results.length, failed: failed.map((f) => f.name + ": " + f.err), hit1, hit5, evals: evals.length };
